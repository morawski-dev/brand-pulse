######################################
# Spring Boot
######################################
spring.application.name=backend
spring.profiles.active=dev
server.port=8080

######################################
# Database - PostgreSQL
######################################
spring.datasource.url=jdbc:postgresql://localhost:5432/brandpulse
spring.datasource.username=brandpulse_user
spring.datasource.password=brandpulse_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Liquibase - DB initialization / migrations
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

######################################
# JWT / Security
######################################
# IMPORTANT: This is a development secret. Generate a new one for production using:
# openssl rand -base64 32
jwt.secret=dGhpc0lzQVNlY3VyZVNlY3JldEtleUZvckJyYW5kUHVsc2VEZXZlbG9wbWVudDEyMzQ1Njc4OTA=
jwt.expiration-minutes=120

# CORS for Next.js local development and production
spring.web.cors.allowed-origins=http://localhost:3000,https://app.brandpulse.io
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

######################################
# Email weekly reports
######################################
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=no-reply@brandpulse.io
spring.mail.password=hasloSMTP
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

######################################
# Scheduling / Tasks
######################################
# CRON: daily at 3 AM
spring.task.scheduling.pool.size=2
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=30s
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100

######################################
# Actuator + metrics + Prometheus
######################################
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
# Mail uses placeholder SMTP credentials in dev; its health contributor would
# otherwise force /actuator/health to DOWN (503). Re-enable for prod with real creds.
management.health.mail.enabled=false

######################################
# Caching - Caffeine
######################################
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

######################################
# OpenAPI / Swagger
######################################
springdoc.api-docs.path=/api-docs
# Use the conventional /swagger-ui.html entry point (redirects to /swagger-ui/index.html).
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.operationsSorter=alpha

######################################
# Jackson / Localization
######################################
spring.jackson.time-zone=Europe/Warsaw
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
spring.messages.basename=messages
spring.messages.encoding=UTF-8

######################################
# OpenRouter AI Configuration
######################################
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
openrouter.api.key=sk-demo-xyz123
openrouter.model=anthropic/claude-3.5-sonnet
openrouter.timeout.ms=10000
