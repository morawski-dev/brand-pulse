spring.application.name=backend-test

######################################
# Database Configuration
# H2 for fast unit tests
# Testcontainers PostgreSQL for integration tests (override in test class)
######################################

# H2 In-Memory Database (default - overridden by AbstractIntegrationTest for PostgreSQL)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
# Note: Do NOT set spring.jpa.database-platform here!
# It will be auto-detected or set by AbstractIntegrationTest
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Liquibase - disabled for tests (using ddl-auto=create-drop)
spring.liquibase.enabled=false

# CORS - for tests
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# JWT - dummy values for tests (minimum 32 characters = 256 bits)
jwt.secret=test-secret-key-for-testing-minimum-32-characters-required
jwt.expiration-minutes=120

# Mail - disable for tests
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test

# Task scheduling - disable for tests
spring.task.scheduling.pool.size=1

# Actuator
management.endpoints.web.exposure.include=health,info

# Cache
spring.cache.type=simple

# OpenRouter - for tests
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
openrouter.api.key=test-key
openrouter.model=test-model
openrouter.timeout.ms=10000

# Google Places - for tests (empty key -> mock path, no real calls)
google.places.api.url=https://places.googleapis.com/v1
google.places.api.key=
